<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Corporación Jorby</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-birthday-cake"></i>
                <h1>Corporación Jorby</h1>
                <p>Panel Administrativo</p>
            </div>

            <form id="form-login" class="login-form">
                <h2><i class="fas fa-user-shield"></i> Iniciar Sesión</h2>

                <label for="usuario">Email</label>
                <input type="email" id="usuario" name="usuario" required autocomplete="email" placeholder="ejemplo@jabys.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña">

                <div id="login-error" class="login-error" style="display:none;"></div>

                <button type="submit" id="btn-login" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>

                <a href="index.html" class="volver-inicio">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
